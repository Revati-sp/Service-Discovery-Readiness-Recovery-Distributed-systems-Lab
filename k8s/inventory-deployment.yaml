apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory
  labels:
    app: inventory
spec:
  replicas: 2                      # exactly 2 Inventory replicas
  selector:
    matchLabels:
      app: inventory
  template:
    metadata:
      labels:
        app: inventory             # matched by the Service selector
    spec:
      terminationGracePeriodSeconds: 10
      containers:
        - name: inventory
          image: inventory:1.0     # built locally and loaded into kind (see README)
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            # Downward API: each replica reports its own identity in every response.
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          # Readiness: decides whether this Pod receives Service traffic.
          # Fast timings so the demo transitions within a few seconds.
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 2
            periodSeconds: 2
            timeoutSeconds: 1
            successThreshold: 1
            failureThreshold: 1
          # Liveness: checks only that the process is alive. /health is NOT
          # affected by /readiness/fail, so a readiness failure never restarts the Pod.
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 1
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 32Mi
            limits:
              cpu: 200m
              memory: 64Mi
