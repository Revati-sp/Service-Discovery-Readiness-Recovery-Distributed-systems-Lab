apiVersion: v1
kind: Service
metadata:
  name: inventory-service          # stable DNS name: inventory-service (.default.svc.cluster.local)
  labels:
    app: inventory
spec:
  type: ClusterIP
  selector:
    app: inventory                 # selects every READY Pod with this label
  ports:
    - name: http
      port: 8080                   # Service port used by the client
      targetPort: http             # containerPort 8080 on the Inventory Pods
